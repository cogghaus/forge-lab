<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>forge-lab · pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0D0D0F;
    --card:      #1A1A1F;
    --card-hi:   #24242C;
    --border:    rgba(255,255,255,0.06);
    --border-hi: rgba(255,255,255,0.12);
    --text:      #F5F0EB;
    --text-dim:  rgba(245,240,235,0.6);
    --text-mute: rgba(245,240,235,0.35);
    --orange:    #FF6B2B;
    --gold:      #FFB547;
    --blue:      #4A9EFF;
    --green:     #2DD4A0;
    --red:       #FF4757;
  }
  html, body { min-height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  #particles {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }
  #bg-gradient {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,107,43,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 120%, rgba(74,158,255,0.08) 0%, transparent 60%);
    transition: opacity 1s ease;
  }
  #app { position: relative; z-index: 1; }

  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  .card { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(8px); }
  .card:hover { border-color: var(--border-hi); }

  /* Heat states -- richer than community */
  .heat-idle {
    box-shadow:
      0 0 0 1px rgba(74,158,255,0.12),
      0 0 30px rgba(74,158,255,0.08),
      inset 0 0 20px rgba(74,158,255,0.02);
  }
  .heat-warm {
    box-shadow:
      0 0 0 1px rgba(255,107,43,0.35),
      0 0 28px rgba(255,107,43,0.2),
      0 0 60px rgba(255,107,43,0.06),
      inset 0 0 20px rgba(255,107,43,0.03);
    animation: breathe-warm 3.5s ease-in-out infinite;
    position: relative;
  }
  .heat-hot {
    box-shadow:
      0 0 0 1px rgba(255,181,71,0.55),
      0 0 40px rgba(255,107,43,0.35),
      0 0 80px rgba(255,107,43,0.15),
      inset 0 0 24px rgba(255,107,43,0.05);
    animation: breathe-hot 2s ease-in-out infinite;
    position: relative;
  }
  .heat-standby { box-shadow: 0 0 0 1px rgba(255,255,255,0.05); opacity: 0.5; }
  .heat-offline { box-shadow: 0 0 0 1px rgba(255,255,255,0.04); opacity: 0.28; }

  @keyframes breathe-warm {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(255,107,43,0.32),
        0 0 24px rgba(255,107,43,0.16),
        0 0 50px rgba(255,107,43,0.05),
        inset 0 0 20px rgba(255,107,43,0.03);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(255,107,43,0.45),
        0 0 34px rgba(255,107,43,0.26),
        0 0 70px rgba(255,107,43,0.12),
        inset 0 0 24px rgba(255,107,43,0.06);
    }
  }
  @keyframes breathe-hot {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(255,181,71,0.5),
        0 0 36px rgba(255,107,43,0.3),
        0 0 70px rgba(255,107,43,0.12);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(255,181,71,0.7),
        0 0 50px rgba(255,107,43,0.45),
        0 0 100px rgba(255,181,71,0.22);
    }
  }

  /* Ember emitter -- rising sparks from the top edge of the hottest cards.
     Replaces the rotating conic border beam (which read as a distracting
     race-track around the card perimeter). Embers stay put and drift up
     from a fixed location, so the eye is not dragged around the rectangle. */
  .ember-emitter {
    position: absolute;
    top: -2px; left: 0; right: 0;
    height: 1px;
    pointer-events: none;
    z-index: 3;
  }
  .ember {
    position: absolute;
    top: 0;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #FFB547;
    box-shadow: 0 0 5px #FF6B2B, 0 0 10px rgba(255,107,43,0.55);
    opacity: 0;
    animation: ember-rise 3s ease-out infinite;
    will-change: transform, opacity;
  }
  .ember:nth-child(1) { left: 22%; animation-delay: 0s;   animation-duration: 2.6s; }
  .ember:nth-child(2) { left: 42%; animation-delay: 0.9s; animation-duration: 3.1s;
    background: #FF6B2B; box-shadow: 0 0 5px #FFB547, 0 0 10px rgba(255,181,71,0.55); }
  .ember:nth-child(3) { left: 62%; animation-delay: 1.6s; animation-duration: 2.8s; }
  .ember:nth-child(4) { left: 80%; animation-delay: 2.3s; animation-duration: 3.3s;
    background: #FF6B2B; box-shadow: 0 0 5px #FFB547, 0 0 10px rgba(255,181,71,0.55); }
  @keyframes ember-rise {
    0%   { transform: translate3d(0, 2px, 0) scale(0.6); opacity: 0; }
    12%  { opacity: 1; }
    50%  { transform: translate3d(2px, -18px, 0) scale(1);   opacity: 0.9; }
    80%  { opacity: 0.4; }
    100% { transform: translate3d(-3px, -40px, 0) scale(0.5); opacity: 0; }
  }

  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
  .dot-active  { background: var(--orange); box-shadow: 0 0 8px rgba(255,107,43,0.8); }
  .dot-active.pulse { animation: dot-pulse 1.5s ease-in-out infinite; }
  @keyframes dot-pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,107,43,0.8); }
    50%      { box-shadow: 0 0 14px rgba(255,107,43,1), 0 0 22px rgba(255,107,43,0.5); }
  }
  .dot-idle    { background: var(--blue); }
  .dot-standby { background: rgba(255,255,255,0.25); }
  .dot-offline { background: rgba(255,255,255,0.15); }

  .bar { background: rgba(255,255,255,0.06); height: 6px; border-radius: 4px; overflow: hidden; position: relative; }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #FF6B2B 0%, #FFB547 100%);
    transition: width 600ms cubic-bezier(.34,.22,.21,1);
    position: relative;
  }
  .bar-fill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: bar-shimmer 2s ease-in-out infinite;
  }
  @keyframes bar-shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; display: inline-block; }
  .badge-pending  { background: rgba(255,255,255,0.06); color: var(--text-dim); }
  .badge-active   { background: rgba(255,107,43,0.18); color: var(--orange); border: 1px solid rgba(255,107,43,0.4); box-shadow: 0 0 12px rgba(255,107,43,0.2); }
  .badge-review   { background: rgba(255,181,71,0.18); color: var(--gold); border: 1px solid rgba(255,181,71,0.4); box-shadow: 0 0 12px rgba(255,181,71,0.2); }
  .badge-complete { background: rgba(45,212,160,0.18); color: var(--green); border: 1px solid rgba(45,212,160,0.4); box-shadow: 0 0 12px rgba(45,212,160,0.2); }
  .badge-attention{ background: rgba(255,71,87,0.18); color: var(--red); border: 1px solid rgba(255,71,87,0.4); box-shadow: 0 0 12px rgba(255,71,87,0.2); }

  .temp-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    transition: all 300ms ease;
    position: relative;
  }
  .temp-cold {
    background: rgba(74,158,255,0.15); color: var(--blue);
    border: 1px solid rgba(74,158,255,0.4);
    box-shadow: 0 0 16px rgba(74,158,255,0.25);
  }
  .temp-warm {
    background: rgba(255,107,43,0.18); color: var(--orange);
    border: 1px solid rgba(255,107,43,0.5);
    box-shadow: 0 0 20px rgba(255,107,43,0.35);
  }
  .temp-hot {
    background: rgba(255,181,71,0.22); color: var(--gold);
    border: 1px solid rgba(255,181,71,0.65);
    box-shadow: 0 0 28px rgba(255,181,71,0.5), 0 0 50px rgba(255,107,43,0.25);
    animation: hot-pulse 1.5s ease-in-out infinite;
  }
  @keyframes hot-pulse {
    0%, 100% { box-shadow: 0 0 28px rgba(255,181,71,0.5), 0 0 50px rgba(255,107,43,0.25); }
    50%      { box-shadow: 0 0 36px rgba(255,181,71,0.8), 0 0 70px rgba(255,107,43,0.4); }
  }

  button { cursor: pointer; }
  .scroll-thin::-webkit-scrollbar { width: 6px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  [role="button"]:focus-visible, button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 4px; }

  /* Number ticker has subtle glow */
  .ticker { text-shadow: 0 0 18px rgba(255,107,43,0.3); }

  /* Task title truncation with marquee fallback when overflowing.
     Ticket number stays visible as a fixed sibling; title lives inside
     a .title-wrap that clips overflow. If JS detects the inner span is
     wider than the wrap, it adds .marquee and sets --marquee-distance so
     the keyframe below can scroll the text back and forth. */
  .title-wrap { overflow: hidden; white-space: nowrap; min-width: 0; }
  .title-wrap > span { display: inline-block; }
  .title-wrap.marquee > span {
    animation: marquee-slide 14s cubic-bezier(.4,0,.6,1) infinite;
  }
  @keyframes marquee-slide {
    0%, 6%    { transform: translateX(0); }
    40%, 60%  { transform: translateX(var(--marquee-distance, 0px)); }
    94%, 100% { transform: translateX(0); }
  }
  .ticket { color: rgba(245,240,235,0.85); font-weight: 600; flex-shrink: 0; }
  .sep { color: rgba(245,240,235,0.25); flex-shrink: 0; padding: 0 2px; }

  /* Confetti via CSS particles */
  .confetti-piece {
    position: fixed; top: 50%; left: 50%;
    width: 8px; height: 8px; border-radius: 2px;
    pointer-events: none; z-index: 100;
    animation: confetti-fly 1400ms ease-out forwards;
  }
  @keyframes confetti-fly {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(var(--r)); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div id="bg-gradient"></div>

<div id="app">

<!-- Top bar -->
<header class="border-b border-white/5 sticky top-0 z-30 backdrop-blur-xl bg-[#0D0D0F]/80">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-2xl leading-none">🔥</span>
      <h1 class="mono text-lg font-bold tracking-tight">forge-lab</h1>
      <span class="badge badge-active">pro</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="temp-btn" class="temp-pill temp-warm" title="Click to cycle temperature">🌡 warm</button>
      <div class="text-xs mono text-white/60"><span id="active-count" class="ticker text-white text-base font-bold">2</span> active</div>
      <button class="w-8 h-8 rounded hover:bg-white/5 flex items-center justify-center text-white/60">⚙</button>
      <button class="w-8 h-8 rounded bg-white/5 hover:bg-white/10 flex items-center justify-center text-sm mono">A</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8 space-y-8">

  <!-- Pipeline -->
  <section aria-label="Task pipeline">
    <div class="grid grid-cols-4 gap-4" id="pipeline-grid"></div>
  </section>

  <!-- Agent ring -->
  <section aria-label="Agent ring">
    <div class="flex items-baseline justify-between mb-3">
      <h2 class="mono text-xs uppercase tracking-wider text-white/50">Agent ring</h2>
      <div class="text-xs mono text-white/40">Click any agent for detail</div>
    </div>
    <div class="grid grid-cols-4 gap-3" id="agent-grid"></div>
  </section>

  <!-- Activity + devices -->
  <section class="grid grid-cols-3 gap-4">
    <div class="col-span-2 card rounded-lg p-5" aria-label="Activity stream">
      <div class="flex items-baseline justify-between mb-3">
        <h2 class="mono text-xs uppercase tracking-wider text-white/50">Activity stream</h2>
        <div class="flex items-center gap-2">
          <span class="dot dot-active pulse"></span>
          <div class="text-xs mono text-white/40">live</div>
        </div>
      </div>
      <div id="activity-list" class="space-y-2 max-h-80 overflow-y-auto scroll-thin"></div>
    </div>
    <div class="card rounded-lg p-5" aria-label="Devices">
      <h2 class="mono text-xs uppercase tracking-wider text-white/50 mb-3">Devices</h2>
      <div class="space-y-3" id="device-list"></div>
      <div class="mt-5 pt-4 border-t border-white/5">
        <h3 class="mono text-xs uppercase tracking-wider text-white/50 mb-2">Forge queue</h3>
        <div class="text-sm mono text-white/70"><span id="queue-count" class="ticker text-lg font-bold text-white">0</span> waiting</div>
        <div class="text-xs mono text-white/40 mt-1">Auto-spawn: <span class="text-white/60">off</span></div>
      </div>
    </div>
  </section>

</main>

<footer class="max-w-7xl mx-auto px-6 pb-8 pt-4 text-xs mono text-white/30 flex items-center justify-between border-t border-white/5 mt-8">
  <div>forge-lab · pro edition · HeroUI + Magic UI Pro visual layer</div>
  <div>mockup · clickable · offline · no real data</div>
</footer>

</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-start justify-center p-6 overflow-y-auto" onclick="if(event.target.id==='modal')closeModal()">
  <div class="card rounded-xl max-w-3xl w-full mt-16 mb-16 p-6 shadow-2xl" id="modal-card">
    <div class="flex items-start justify-between mb-4">
      <div id="modal-header"></div>
      <button onclick="closeModal()" class="text-white/40 hover:text-white text-xl leading-none">&times;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
/* Ember emitter template -- injected into the hottest pipeline pillar
   and the hottest agent tile to replace the old rotating border beam. */
const EMBERS = '<div class="ember-emitter"><span class="ember"></span><span class="ember"></span><span class="ember"></span><span class="ember"></span></div>';

/* Task metadata -- title plus the agent currently working (or who last
   touched) the task, with an icon for visual identification in the
   pipeline pillars. Used by renderPipeline (with icon) and renderAgents
   (title only). Titles that overflow get marquee scrolled via
   applyMarquees() after render. */
const TASKS = {
  'FL-001':     { title: 'Port minimum-viable-council personalities',             agent: 'scribe',   icon: '📜' },
  'FL-001b':    { title: 'Deny-list smoke test',                                   agent: 'crucible', icon: '🧪' },
  'FL-002R':    { title: 'Composition helper + daemon wiring + first smoke test', agent: 'anvil',    icon: '🔨' },
  'FL-003':     { title: 'BOM handling + content gate refactor',                  agent: null,       icon: null },
  'FL-004':     { title: 'forge-dash-community scaffold',                         agent: null,       icon: null },
  'FL-005':     { title: 'Heimdall v1 daemon proxy',                              agent: null,       icon: null },
  'FL-006':     { title: 'Deployment automation for accserver',                   agent: null,       icon: null },
  'FL-REV-001': { title: 'Code review of FL-001 delivery',                        agent: 'temper',   icon: '⚖️' },
  'FL-PHASE1':  { title: 'Phase 1 vertical slice',                                agent: 'anvil',    icon: '🔨' },
};

/* ========== STATE (identical to community) ========== */
const STATE = {
  temperature: 'warm',
  pipeline: {
    pending:  { count: 4, label: 'Pending', ids: ['FL-003','FL-004','FL-005','FL-006'] },
    active:   { count: 2, label: 'Active',  ids: ['FL-002R','FL-001b'] },
    review:   { count: 1, label: 'Review',  ids: ['FL-REV-001'] },
    complete: { count: 27,label: 'Complete',ids: ['FL-001','FL-PHASE1','...'] },
  },
  agents: [
    { id:'architect', name:'Architect', icon:'🏛️', status:'idle',    heat:'idle',    task:null,     progress:0 , runtime:'claude-code', device:'workstation', lastSeen:'3m ago' },
    { id:'anvil',     name:'Anvil',     icon:'🔨', status:'working', heat:'warm',    task:'FL-002R',progress:62, runtime:'claude-code', device:'workstation', lastSeen:'just now' },
    { id:'furnace',   name:'Furnace',   icon:'🔥', status:'standby', heat:'standby', task:null,     progress:0 , runtime:'claude-code', device:'—',           lastSeen:'—' },
    { id:'crucible',  name:'Crucible',  icon:'🧪', status:'working', heat:'warm',    task:'FL-001b',progress:12, runtime:'claude-code', device:'laptop',     lastSeen:'just now' },
    { id:'temper',    name:'Temper',    icon:'⚖️', status:'idle',    heat:'idle',    task:null,     progress:0 , runtime:'claude-code', device:'workstation', lastSeen:'42m ago' },
    { id:'scribe',    name:'Scribe',    icon:'📜', status:'idle',    heat:'idle',    task:null,     progress:0 , runtime:'claude-code', device:'workstation', lastSeen:'4h ago' },
    { id:'aegis',     name:'Aegis',     icon:'🛡️', status:'standby', heat:'standby', task:null,     progress:0 , runtime:'claude-code', device:'—',           lastSeen:'—' },
    { id:'loki',      name:'Loki',      icon:'🎭', status:'hub',     heat:'offline', task:null,     progress:0 , runtime:'hub-inline',  device:'—',           lastSeen:'hub-side' },
  ],
  devices: [
    { id:'workstation', label:'workstation', kind:'🖥', status:'online',  lastSeen:'live' },
    { id:'laptop',      label:'laptop',      kind:'💻', status:'online',  lastSeen:'live' },
    { id:'workbench',   label:'workbench',   kind:'🏢', status:'offline', lastSeen:'2h ago' },
  ],
  activity: [
    { t:'12:04', agent:'🔨', actor:'Anvil',    verb:'claimed',   id:'FL-002R', kind:'active' },
    { t:'12:03', agent:'⚖️', actor:'Temper',   verb:'approved',  id:'FL-001',  kind:'review' },
    { t:'12:01', agent:'🧪', actor:'Crucible', verb:'completed', id:'FL-REV-002', kind:'complete' },
    { t:'11:58', agent:'📜', actor:'Scribe',   verb:'started',   id:'FL-001',  kind:'active' },
    { t:'11:45', agent:'⚒️', actor:'Hub',      verb:'approved',  id:'FL-PHASE1', kind:'review' },
    { t:'11:30', agent:'🎭', actor:'Loki',     verb:'flagged',   id:'FL-REV-004', kind:'attention' },
    { t:'11:22', agent:'🔨', actor:'Anvil',    verb:'claimed',   id:'FL-PHASE1', kind:'active' },
    { t:'11:05', agent:'🛡️', actor:'Aegis',    verb:'cleared',   id:'FL-001',  kind:'complete' },
  ],
  tasks: {
    'FL-002R': {
      id:'FL-002R', title:'Composition helper + daemon wiring + first smoke test',
      status:'active', priority:'high', epic:'FL-EPIC-PHASE2-AGENTS',
      agent:'anvil', runtime:'claude-code', device:'workstation', progress:62,
      description:'Wire composeSystemPrompt() into the daemon spawn path. Prove end-to-end ClaudeCodeRuntime spawn with real personality + project context layered correctly.',
      timeline:[
        {t:'12:04',kind:'done',text:'🔨 Anvil claimed'},
        {t:'12:04',kind:'done',text:'daemon wrote .forge/tasks/FL-002R.md'},
        {t:'12:04',kind:'done',text:'ClaudeCodeRuntime spawned in new tab'},
        {t:'12:05',kind:'done',text:'agent read task file'},
        {t:'12:07',kind:'live',text:'agent editing packages/forge-agents/src/compose-prompt.ts'},
        {t:'—',    kind:'pending',text:'unit tests'},
        {t:'—',    kind:'pending',text:'daemon wiring'},
        {t:'—',    kind:'pending',text:'integration test'},
      ],
    },
    'FL-001b': {
      id:'FL-001b', title:'Deny-list smoke test',
      status:'active', priority:'high', epic:'FL-EPIC-PHASE2-AGENTS',
      agent:'crucible', runtime:'claude-code', device:'laptop', progress:12,
      description:'One-shot smoke test to confirm bypassPermissions + deny list actually blocks matching tool calls. Innocuous marker: Read(G:/dev/forge-lab/LICENSE).',
      timeline:[
        {t:'12:12',kind:'done',text:'🧪 Crucible claimed'},
        {t:'12:12',kind:'done',text:'daemon wrote task file'},
        {t:'12:12',kind:'live',text:'running innocuous Bash smoke sequence'},
        {t:'—',    kind:'pending',text:'attempt denied Read'},
        {t:'—',    kind:'pending',text:'record result'},
      ],
    },
  },
};

/* ========== PARTICLE SYSTEM ========== */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

const TEMP_CONFIG = {
  cold: { count: 20, speed: 0.25, color: (a)=>`rgba(74,158,255,${a})`, size: 1.4 },
  warm: { count: 55, speed: 0.55, color: (a)=>`rgba(255,107,43,${a})`, size: 1.8 },
  hot:  { count: 110, speed: 1.0, color: (a)=>`rgba(255,181,71,${a})`, size: 2.2 },
};

function spawnParticles() {
  const cfg = TEMP_CONFIG[STATE.temperature];
  particles = [];
  for (let i = 0; i < cfg.count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vy: -(Math.random() * cfg.speed + cfg.speed * 0.5),
      vx: (Math.random() - 0.5) * cfg.speed * 0.3,
      r: Math.random() * cfg.size + 0.6,
      life: Math.random(),
      fadeSpeed: Math.random() * 0.005 + 0.002,
    });
  }
}
spawnParticles();

function tick() {
  const cfg = TEMP_CONFIG[STATE.temperature];
  ctx.clearRect(0, 0, W, H);
  for (const p of particles) {
    p.y += p.vy;
    p.x += p.vx;
    p.life += p.fadeSpeed;
    if (p.y < -10 || p.life > 1) {
      p.x = Math.random() * W;
      p.y = H + 10;
      p.life = 0;
    }
    // brightness envelope: fade in, hold, fade out
    const env = Math.sin(p.life * Math.PI);
    const alpha = Math.max(0, env * 0.7);
    ctx.beginPath();
    ctx.fillStyle = cfg.color(alpha);
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    // little glow
    ctx.beginPath();
    ctx.fillStyle = cfg.color(alpha * 0.25);
    ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(tick);
}
tick();

/* ========== RENDER: pipeline pillars ========== */
const PILLARS = ['pending','active','review','complete'];

/* ========== NUMBER TICKER ========== */
function animateTickers() {
  document.querySelectorAll('[data-ticker]').forEach(el => {
    const target = parseInt(el.dataset.ticker, 10);
    const duration = 900;
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(target * eased);
      if (t < 1) requestAnimationFrame(step);
      else el.textContent = target;
    }
    requestAnimationFrame(step);
  });
}

/* ========== TEMPERATURE CYCLE ========== */
const TEMP_CYCLE = ['cold','warm','hot'];
function cycleTemp() {
  const i = TEMP_CYCLE.indexOf(STATE.temperature);
  STATE.temperature = TEMP_CYCLE[(i+1) % TEMP_CYCLE.length];
  applyTemp();
  spawnParticles();
}
function applyTemp() {
  const btn = document.getElementById('temp-btn');
  btn.classList.remove('temp-cold','temp-warm','temp-hot');

    warm: 'radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,107,43,0.12) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 50% 120%, rgba(74,158,255,0.08) 0%, transparent 60%)',
    hot:  'radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,107,43,0.22) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 50% 120%, rgba(255,181,71,0.15) 0%, transparent 60%)',
  })[t];

/* ========== CONFETTI ========== */
function confetti() {
  const colors = ['#FF6B2B','#FFB547','#2DD4A0','#4A9EFF','#F5F0EB'];
  for (let i = 0; i < 32; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const angle = (Math.PI * 2 * i) / 32 + Math.random() * 0.3;
    const dist  = 200 + Math.random() * 180;
    piece.style.setProperty('--tx', `calc(-50% + ${Math.cos(angle) * dist}px)`);
    piece.style.setProperty('--ty', `calc(-50% + ${Math.sin(angle) * dist}px)`);
    piece.style.setProperty('--r',  `${Math.random() * 720}deg`);
    piece.style.background = colors[i % colors.length];
    piece.style.animationDuration = `${1200 + Math.random() * 600}ms`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 2000);
  }
}

function openModal(header, body) {
  document.getElementById('modal-header').innerHTML = header;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  // Re-measure any .title-wrap elements in the newly-visible modal content.
  // Two rAFs: first pass ensures layout has happened, second pass measures.
  requestAnimationFrame(() => requestAnimationFrame(applyMarquees));
}
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* Look up an agent's emoji icon by id from STATE.agents. Used to prefix
   the "assigned to" field in the task detail modal so the reader can see
   at a glance which agent is on the job. */
function agentIcon(id) {
  return STATE.agents.find(a => a.id === id)?.icon ?? '';
}

/* ========== MARQUEE ==========
 * For every .title-wrap on the page, measure whether the inner span
 * overflows its wrapper. If yes, add .marquee and compute the exact
 * translateX distance needed to reveal the hidden tail. The CSS keyframe
 * handles the scroll-out / hold / scroll-back animation. */
function applyMarquees() {
  document.querySelectorAll('.title-wrap').forEach(w => {
    const span = w.querySelector('span');
    if (!span) return;
    w.classList.remove('marquee');
    w.style.removeProperty('--marquee-distance');
    const overflow = span.scrollWidth - w.clientWidth;
    if (overflow > 4) {
      w.classList.add('marquee');
      // Extra 8px so the tail fully clears the right edge before reversing.
      w.style.setProperty('--marquee-distance', `-${overflow + 8}px`);
    }
  });
}
let marqueeDebounce;
window.addEventListener('resize', () => {
  clearTimeout(marqueeDebounce);
  marqueeDebounce = setTimeout(applyMarquees, 150);
});

/* ========== INIT ========== */
document.getElementById('temp-btn').addEventListener('click', cycleTemp);
renderPipeline();
renderAgents();
renderActivity();
renderDevices();
applyTemp();
animateTickers();
requestAnimationFrame(() => requestAnimationFrame(applyMarquees));
</script>
