name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, accserver]
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest code
        run: git pull origin main

      - name: Build and deploy all services
        run: |
          docker compose \
            -f deploy/compose.yml \
            --env-file /datapool/docker/vibe-forge/.env \
            up -d --build --remove-orphans

      - name: Verify health
        run: |
          sleep 15
          docker inspect --format='{{.Names}} {{.State.Health.Status}}' forge-hub forge-dash forge-mcp
