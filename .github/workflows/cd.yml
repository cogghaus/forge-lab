# CD: build images on GitHub-hosted runners and push to GHCR. Nothing here
# reaches any private infrastructure.
#
# This repo is PUBLIC and deliberately has NO self-hosted runner. It used to end
# with a deploy job running on a box on a private LAN with the docker socket
# mounted, which is root-equivalent on that host. That is an unusual amount of
# trust to place in a public repo's workflow surface, so the trust direction is
# inverted: the deploy host now POLLS this registry and pulls by digest. Nothing
# calls inward.
#
# Deployment therefore lives on the deploy host, not in this file. See
# docs/DEPLOYMENT.md.
#
# Issue 50 (docs/design/m3-reliability.md): builds used to run on the deploy box
# itself and once drove load to ~1400, wedging the host. They run on
# ubuntu-latest with buildx + GHA layer cache now, and the host only ever pulls.
#
# The five ghcr.io/cogghaus/forge-lab-* packages are created on first push and
# default to private. Grant read access to whatever identity pulls them, or make
# them public, via each package's Settings.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: cogghaus

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - image: forge-lab-hub
            context: .
            dockerfile: packages/forge-hub/Dockerfile
          - image: forge-lab-dash
            context: .
            dockerfile: packages/forge-dash-community/Dockerfile
          - image: forge-lab-mcp
            context: .
            dockerfile: packages/forge-mcp/Dockerfile
          - image: forge-lab-daemon
            context: .
            dockerfile: packages/forge-daemon/Dockerfile
          - image: forge-lab-waker
            context: deploy/waker
            dockerfile: deploy/waker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

