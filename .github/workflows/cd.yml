name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, deploy-host]
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest code
        run: git pull origin main

      - name: Build and deploy all services
        run: |
          docker compose -p deploy \
            -f deploy/compose.yml \
            --env-file <data-root>/.env \
            up -d --build --remove-orphans

      - name: Build and deploy daemons
        run: |
          docker compose -p forge-daemons \
            -f deploy/daemons.compose.yml \
            --env-file <data-root>/.env.daemons \
            up -d --build --remove-orphans

      - name: Verify health
        run: |
          sleep 15
          docker inspect --format='{{.Name}} {{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' forge-hub forge-dash forge-mcp
