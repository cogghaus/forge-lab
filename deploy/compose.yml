# forge-lab deploy compose
#
# Usage (from repo root on deploy-host):
#   docker compose -f deploy/compose.yml up -d --build
#
# Secrets via env file (never commit):
#   Copy deploy/.env.example → <data-root>/.env, fill it in, then:
#   docker compose -f deploy/compose.yml --env-file <data-root>/.env up -d --build
#
# Data volume:   <data-root>/data/   (SQLite DB)
# Workdir volume: <data-root>/workdir/ (agent logs, future daemon use)

services:
  forge-hub:
    build:
      context: ..
      dockerfile: packages/forge-hub/Dockerfile
    image: vibe-forge-hub:latest
    container_name: forge-hub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FORGE_HUB_PORT: "3000"
      FORGE_HUB_HOST: "0.0.0.0"
      FORGE_HUB_DATABASE_URL: "file:/data/forge-hub.db"
      FORGE_HUB_SESSION_SECRET: "${FORGE_HUB_SESSION_SECRET:?Set FORGE_HUB_SESSION_SECRET in env file}"
      FORGE_HUB_COOKIE_SECURE: "true"
      FORGE_HUB_SESSION_TTL_HOURS: "336"
      FORGE_HUB_BCRYPT_COST: "12"
    volumes:
      - <data-root>/data:/data
    ports:
      - "127.0.0.1:3000:3000"  # localhost-only; enables bootstrap curl from deploy-host host
    networks:
      - vibe-forge-internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3

  forge-dash:
    build:
      context: ..
      dockerfile: packages/forge-dash-community/Dockerfile
    image: vibe-forge-dash:latest
    container_name: forge-dash
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FORGE_HUB_URL: "http://forge-hub:3000"
      FORGE_WORKDIR: "/workdir"
    volumes:
      - <data-root>/workdir:/workdir:ro
    depends_on:
      forge-hub:
        condition: service_healthy
    networks:
      - vibe-forge-internal
      - apps-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lab.rule=Host(`forge.example.com`)"
      - "traefik.http.routers.lab.entrypoints=websecure"
      - "traefik.http.routers.lab.tls=true"
      - "traefik.http.services.lab.loadbalancer.server.port=3001"
      - "traefik.docker.network=apps-internal"

networks:
  vibe-forge-internal:
    driver: bridge
  apps-internal:
    external: true  # Traefik's discovery network — must exist on deploy-host
