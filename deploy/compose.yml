# forge-lab deploy compose
#
# Images: built in CI (.github/workflows/cd.yml) and pushed to
#   ghcr.io/cogghaus/forge-lab-<svc>. Production (accserver) pulls
#   only, driven by IMAGE_TAG=<short-sha> exported by the CD deploy job:
#     docker compose -f deploy/compose.yml pull
#     docker compose -f deploy/compose.yml up -d --no-build --remove-orphans
#   Rollback: IMAGE_TAG=<previous-sha> docker compose -f deploy/compose.yml up -d --no-build
#
# Local dev (build from source, no registry involved):
#   docker compose -f deploy/compose.yml up -d --build
#
# Secrets via env file (never commit):
#   Copy deploy/.env.example → /datapool/docker/vibe-forge/.env, fill it in, then:
#   docker compose -f deploy/compose.yml --env-file /datapool/docker/vibe-forge/.env up -d --build
#
# Data volume:   /datapool/docker/vibe-forge/data/   (SQLite DB)
# Workdir volume: /datapool/docker/vibe-forge/workdir/ (agent logs, future daemon use)

services:
  forge-hub:
    build:
      context: ..
      dockerfile: packages/forge-hub/Dockerfile
    image: ghcr.io/cogghaus/forge-lab-hub:${IMAGE_TAG:-latest}
    container_name: forge-hub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FORGE_HUB_PORT: "3000"
      FORGE_HUB_HOST: "0.0.0.0"
      FORGE_HUB_DATABASE_URL: "file:/data/forge-hub.db"
      FORGE_HUB_SESSION_SECRET: "${FORGE_HUB_SESSION_SECRET:?Set FORGE_HUB_SESSION_SECRET in env file}"
      FORGE_HUB_COOKIE_SECURE: "true"
      FORGE_HUB_SESSION_TTL_HOURS: "336"
      FORGE_HUB_BCRYPT_COST: "12"
      FORGE_SEQUENCES_ENABLED: "1"  # gate for new sequenced-task creation (POST sequenceSpec); ongoing phase execution runs regardless
      RESEND_API_KEY: "${RESEND_API_KEY}"
      APP_BASE_URL: "${APP_BASE_URL:-https://lab.local.cogg.haus}"
    volumes:
      - /datapool/docker/vibe-forge/data:/data
    ports:
      - "127.0.0.1:3000:3000"  # localhost-only; enables bootstrap curl from accserver host
    networks:
      - vibe-forge-internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3

  forge-dash:
    build:
      context: ..
      dockerfile: packages/forge-dash-community/Dockerfile
    image: ghcr.io/cogghaus/forge-lab-dash:${IMAGE_TAG:-latest}
    container_name: forge-dash
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FORGE_HUB_URL: "http://forge-hub:3000"
      FORGE_WORKDIR: "/workdir"
      # Deployed build id, shown in the dash rail footer. Set by the deploy
      # command: BUILD_SHA=$(git rev-parse --short HEAD) docker compose up -d ...
      BUILD_SHA: "${BUILD_SHA:-dev}"
    volumes:
      - /datapool/docker/vibe-forge/workdir:/workdir:ro
    depends_on:
      forge-hub:
        condition: service_healthy
    networks:
      - vibe-forge-internal
      - apps-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lab.rule=Host(`lab.local.cogg.haus`)"
      - "traefik.http.routers.lab.entrypoints=websecure"
      - "traefik.http.routers.lab.tls=true"
      - "traefik.http.services.lab.loadbalancer.server.port=3001"
      - "traefik.docker.network=apps-internal"

  forge-mcp:
    build:
      context: ..
      dockerfile: packages/forge-mcp/Dockerfile
    image: ghcr.io/cogghaus/forge-lab-mcp:${IMAGE_TAG:-latest}
    container_name: forge-mcp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FORGE_HUB_URL: "http://forge-hub:3000"
      FORGE_MCP_EMAIL: "${FORGE_MCP_EMAIL}"
      FORGE_MCP_PASSWORD: "${FORGE_MCP_PASSWORD}"
      FORGE_MCP_API_KEY: "${FORGE_MCP_API_KEY}"
      PORT: "4000"
    depends_on:
      forge-hub:
        condition: service_healthy
    networks:
      - vibe-forge-internal
      - apps-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forge-mcp.rule=Host(`mcp.lab.local.cogg.haus`)"
      - "traefik.http.routers.forge-mcp.entrypoints=websecure"
      - "traefik.http.routers.forge-mcp.tls=true"
      - "traefik.http.services.forge-mcp.loadbalancer.server.port=4000"
      - "traefik.docker.network=apps-internal"

networks:
  vibe-forge-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.100.0/24
  apps-internal:
    external: true  # Traefik's discovery network — must exist on accserver
