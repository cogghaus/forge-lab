services:
  forge-hub:
    image: forge-hub:latest
    build:
      context: ..
      dockerfile: packages/forge-hub/Dockerfile
    container_name: forge-hub
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      FORGE_HUB_PORT: "3000"
      FORGE_HUB_HOST: "0.0.0.0"
      FORGE_HUB_DATABASE_URL: "file:/data/forge-hub.db"
      FORGE_HUB_SESSION_SECRET_FILE: /run/secrets/session_secret
      FORGE_HUB_COOKIE_SECURE: "true"
    secrets:
      - session_secret
    volumes:
      - hub-data:/data
    ports:
      - "4276:3000"
    networks:
      - forge
      - apps-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.forge-hub.rule: "Host(`hub.example.com`)"
      traefik.http.routers.forge-hub.entrypoints: "websecure"
      traefik.http.routers.forge-hub.tls: "true"
      traefik.http.routers.forge-hub.tls.certresolver: "cloudflare"
      traefik.http.services.forge-hub.loadbalancer.server.port: "3000"

  # forge-dash-pro will bind to port 4275 once scaffolded
  # Cloudflare tunnel: forge.example.com -> deploy-host:4275
  # Cloudflare tunnel: forgeapi.example.com -> deploy-host:4276

secrets:
  session_secret:
    file: <config-root>/secrets/session_secret

volumes:
  hub-data:

networks:
  forge:
  apps-internal:
    external: true
